<!DOCTYPE html>

<head>
  <title>Admin Dashboard - Pro Store</title>
  <link rel="stylesheet" href="style.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>

<button class="theme-toggle" onclick="toggleTheme()">🌓 Dark/Light</button>

<div class="header">
  <h1>👑 Admin Dashboard</h1>
  <p>Manage your products, track views, and grow your store</p>
</div>

<div class="admin-container">
  <h2 id="formTitle">📝 Add New Product</h2>
  
  <!-- Product Type Selection -->
  <div style="margin: 15px 0;">
    <label style="font-weight: 600; display: block; margin-bottom: 8px;">📂 Product Type:</label>
    <select id="productType" class="admin-input" onchange="toggleFolderFields()">
      <option value="single">📄 Single Product</option>
      <option value="folder">📁 Folder (Multiple Products)</option>
    </select>
  </div>
  
  <!-- Common Fields -->
  <input id="title" class="admin-input" placeholder="Product/Folder Name *" required>
  <select id="category" class="admin-input">
    <option value="">Select Category *</option>
    <option value="men">👔 Men</option>
    <option value="women">💄 Women</option>
    <option value="kids">🧸 Kids</option>
  </select>
  
  <!-- Thumbnail Image -->
  <div id="thumbnailSection">
    <label style="font-weight: 600; display: block; margin: 10px 0 5px;">🖼️ Thumbnail Image:</label>
    <input type="file" id="imageFile" class="admin-input" accept="image/*">
  </div>
  
  <!-- Links Container (Single Product) -->
  <div id="linksSection">
    <label style="font-weight: 600; display: block; margin: 10px 0 5px;">🔗 Product Links:</label>
    <div id="linksContainer">
      <div class="link-group" id="linkGroup1">
        <div style="display: flex; gap: 10px; align-items: center; margin: 10px 0;">
          <input type="url" class="admin-input link-input" placeholder="🔗 Product Link *" style="flex: 1;" oninput="detectPlatform(this)">
          <span class="platform-badge" id="platformBadge1" style="background: #666; color: white; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; white-space: nowrap;">🏷️ Auto-Detect</span>
          <button type="button" class="remove-link-btn" onclick="removeLink(this)" style="display:none;">✕</button>
        </div>
      </div>
    </div>
    <button type="button" class="add-link-btn" onclick="addLinkField()">➕ Add Another Link</button>
  </div>
  
  <!-- Folder Products Container -->
  <div id="folderProductsContainer" style="display:none; margin-top: 20px; border-top: 2px dashed #e0e0e0; padding-top: 20px;">
    <h3>📁 Products in this Folder</h3>
    <div id="folderProductsList"></div>
    <button type="button" class="add-link-btn" onclick="openFolderProductModal()" style="margin-top: 10px;">➕ Add Product to Folder</button>
  </div>
  
  <button class="publish-btn" id="publishBtn" onclick="addProduct()">🚀 Publish Product</button>
  
  <div id="productsList" class="products-list"></div>
</div>

<!-- Folder Product Modal -->
<div id="folderProductModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:9999; padding:20px; overflow-y:auto;">
  <div style="max-width:600px; margin:50px auto; background:white; border-radius:20px; padding:30px; position:relative;">
    <button onclick="closeFolderProductModal()" style="position:absolute; top:10px; right:15px; background:#ff4757; color:white; border:none; padding:8px 16px; border-radius:50%; cursor:pointer; font-size:20px;">✕</button>
    <h3 id="folderModalTitle">📝 Add Product to Folder</h3>
    
    <input id="folderProductTitle" class="admin-input" placeholder="Product Title *" required>
    
    <label style="font-weight: 600; display: block; margin: 10px 0 5px;">🖼️ Product Image:</label>
    <input type="file" id="folderProductImage" class="admin-input" accept="image/*">
    
    <label style="font-weight: 600; display: block; margin: 10px 0 5px;">🔗 Product Links:</label>
    <div id="folderLinksContainer">
      <div class="link-group" id="folderLinkGroup1">
        <div style="display: flex; gap: 10px; align-items: center; margin: 10px 0;">
          <input type="url" class="admin-input folder-link-input" placeholder="🔗 Product Link *" style="flex: 1;" oninput="detectFolderPlatform(this)">
          <span class="platform-badge" id="folderPlatformBadge1" style="background: #666; color: white; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; white-space: nowrap;">🏷️ Auto-Detect</span>
          <button type="button" class="remove-link-btn" onclick="removeFolderLink(this)" style="display:none;">✕</button>
        </div>
      </div>
    </div>
    <button type="button" class="add-link-btn" onclick="addFolderLinkField()">➕ Add Another Link</button>
    
    <button class="publish-btn" onclick="saveFolderProduct()" style="margin-top:20px;">💾 Save Product</button>
  </div>
</div>
