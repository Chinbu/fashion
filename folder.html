<!DOCTYPE html>
<html>
<head>
  <title>📁 Folder - SEAWING DEALS</title>
  <link rel="stylesheet" href="style.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>

<button class="theme-toggle" onclick="toggleTheme()">🌓 Dark/Light</button>

<div id="folderContent" style="max-width:1400px; margin:0 auto; padding:20px;">
  <div style="text-align:center; padding:50px;">
    <div class="spinner"></div>
    <p>Loading folder...</p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
  // ============ Platform Detection Functions ============
  function detectPlatformFromUrl(url) {
    if (!url) return 'Other';
    const platforms = {
      'amazon': 'Amazon',
      'flipkart': 'Flipkart',
      'meesho': 'Meesho',
      'myntra': 'Myntra',
      'shopsy': 'Shopsy',
      'ajio': 'Ajio',
      'nykaa': 'Nykaa',
      'tatacliq': 'Tata Cliq'
    };
    
    url = url.toLowerCase();
    for (const [key, value] of Object.entries(platforms)) {
      if (url.includes(key)) {
        return value;
      }
    }
    return 'Other';
  }

  function getPlatformColor(platform) {
    const colors = {
      'Amazon': '#ff9900',
      'Flipkart': '#2874f0',
      'Meesho': '#e91e63',
      'Myntra': '#e62e4a',
      'Shopsy': '#ff6b35',
      'Ajio': '#ff9900',
      'Nykaa': '#f15a6c',
      'Tata Cliq': '#4a8bff',
      'Other': '#667eea'
    };
    return colors[platform] || '#667eea';
  }

  function getPlatformIcon(platform) {
    const icons = {
      'Amazon': '🛒',
      'Flipkart': '🛍️',
      'Meesho': '✨',
      'Myntra': '👗',
      'Shopsy': '🛍️',
      'Ajio': '👕',
      'Nykaa': '💄',
      'Tata Cliq': '🛒',
      'Other': '🔗'
    };
    return icons[platform] || '🔗';
  }

  function escapeHtml(str) {
    if(!str) return '';
    return str.replace(/[&<>]/g, function(m) {
      if(m === '&') return '&amp;';
      if(m === '<') return '&lt;';
      if(m === '>') return '&gt;';
      return m;
    });
  }

  function toggleTheme() {
    document.body.classList.toggle('dark');
    const isDark = document.body.classList.contains('dark');
    localStorage.setItem('theme', isDark ? 'dark' : 'light');
    
    const folderId = localStorage.getItem('folderToOpen');
    if (folderId) {
      loadFolder();
    }
  }

  // ============ Go Back to Index with State ============
  function goBackToIndex() {
    const folderId = localStorage.getItem('folderToOpen');
    if (folderId) {
      sessionStorage.setItem('returnToFolder', folderId);
    }
    
    const savedCategory = sessionStorage.getItem('currentCategory');
    if (savedCategory) {
      sessionStorage.setItem('currentCategory', savedCategory);
    }
    
    // Go back to index page in same tab
    window.location.href = 'index.html';
  }

  // ============ Load Folder Data ============
  async function loadFolder() {
    const folderId = localStorage.getItem('folderToOpen');
    const container = document.getElementById('folderContent');
    
    if (!folderId) {
      container.innerHTML = `
        <div style="text-align:center;padding:50px;background:white;border-radius:20px;box-shadow:0 10px 40px rgba(0,0,0,0.1);">
          <h2>❌ No folder selected</h2>
          <p><button onclick="goBackToIndex()" style="background:#667eea;color:white;padding:10px 25px;border:none;border-radius:8px;cursor:pointer;font-weight:600;">← Go back to home</button></p>
        </div>
      `;
      return;
    }
    
    try {
      const { data: folder, error } = await supabaseClient
        .from("products")
        .select("*")
        .eq("id", folderId)
        .single();
      
      if (error || !folder) {
        container.innerHTML = `
          <div style="text-align:center;padding:50px;background:white;border-radius:20px;box-shadow:0 10px 40px rgba(0,0,0,0.1);">
            <h2>❌ Folder not found</h2>
            <p>The folder you are looking for does not exist.</p>
            <p><button onclick="goBackToIndex()" style="background:#667eea;color:white;padding:10px 25px;border:none;border-radius:8px;cursor:pointer;font-weight:600;">← Go back to home</button></p>
          </div>
        `;
        return;
      }
      
      renderFolder(folder);
      
    } catch(error) {
      container.innerHTML = `
        <div style="text-align:center;padding:50px;background:white;border-radius:20px;box-shadow:0 10px 40px rgba(0,0,0,0.1);">
          <h2>❌ Error loading folder</h2>
          <p>${error.message}</p>
          <p><button onclick="goBackToIndex()" style="background:#667eea;color:white;padding:10px 25px;border:none;border-radius:8px;cursor:pointer;font-weight:600;">← Go back to home</button></p>
        </div>
      `;
    }
  }

  // ============ Render Folder with Same Design as Index ============
  function renderFolder(folder) {
    const folderProducts = folder.folder_products || [];
    const isDark = document.body.classList.contains('dark');
    const container = document.getElementById('folderContent');
    
    if (folderProducts.length === 0) {
      container.innerHTML = `
        <div style="max-width:900px;margin:0 auto;">
          <button onclick="goBackToIndex()" style="background:#667eea;color:white;padding:10px 25px;border:none;border-radius:8px;cursor:pointer;font-weight:600;margin-bottom:20px;transition:transform 0.2s;font-size:14px;" 
             onmouseover="this.style.transform='translateY(-2px)'" 
             onmouseout="this.style.transform='translateY(0)'">← Back to Home</button>
          
          <div style="background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);padding:30px 20px;border-radius:20px;text-align:center;color:white;box-shadow:0 10px 30px rgba(0,0,0,0.1);">
            <h1 style="margin:0;font-size:2.5rem;">📁 ${escapeHtml(folder.title)}</h1>
            <p style="margin-top:10px;">This folder is empty!</p>
          </div>
        </div>
      `;
      return;
    }
    
    let productsHTML = '';
    
    folderProducts.forEach((fp, index) => {
      let links = fp.links || [];
      
      let buttonsHTML = links.map(link => {
        const platform = link.platform || detectPlatformFromUrl(link.url) || 'Other';
        const platformKey = platform.toLowerCase();
        return `<button onclick="window.open('${link.url}', '_blank')" 
                 class="btn ${platformKey}" 
                 style="background: ${getPlatformColor(platform)};">
          ${getPlatformIcon(platform)} ${platform}
        </button>`;
      }).join('');
      
      productsHTML += `
        <div class="card" style="animation: fadeIn 0.3s ease;">
          ${fp.image ? `<img src="${fp.image}" alt="${fp.title}" loading="lazy" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22200%22 height=%22200%22%3E%3Crect width=%22200%22 height=%22200%22 fill=%22%23e0e0e0%22/%3E%3Ctext x=%2250%%22 y=%2250%%22 text-anchor=%22middle%22 dy=%22.3em%22 font-size=%2250%22 fill=%22%23999%22%3E📷%3C/text%3E%3C/svg%3E'">` : `<div style="width:100%;height:200px;background:#e0e0e0;display:flex;align-items:center;justify-content:center;font-size:60px;">📷</div>`}
          <h3>${index + 1}. ${escapeHtml(fp.title)}</h3>
          <div class="product-buttons">
            ${buttonsHTML}
          </div>
        </div>
      `;
    });
    
    container.innerHTML = `
      <div style="max-width:1400px; margin:0 auto;">
        <!-- Back Button -->
        <button onclick="goBackToIndex()" style="background:#667eea;color:white;padding:10px 25px;border:none;border-radius:8px;cursor:pointer;font-weight:600;margin-bottom:20px;transition:transform 0.2s;font-size:14px;" 
           onmouseover="this.style.transform='translateY(-2px)'" 
           onmouseout="this.style.transform='translateY(0)'">← Back to Home</button>
        
        <!-- Header - Same as Index -->
        <div style="background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);padding:30px 20px;border-radius:20px;margin:0 0 20px 0;text-align:center;color:white;box-shadow:0 10px 30px rgba(0,0,0,0.1);">
          <h1 style="margin:0;font-size:2.5rem;">📁 ${escapeHtml(folder.title)}</h1>
          <p style="margin-top:10px;">${folderProducts.length} products available in this collection</p>
        </div>
        
        <!-- Product Count Badge -->
        <div style="text-align:center;margin-bottom:20px;padding:12px;background:rgba(102,126,234,0.1);border-radius:50px;font-size:14px;color:#667eea;font-weight:600;">
          📂 Showing ${folderProducts.length} products
        </div>
        
        <!-- Products Grid - Same as Index -->
        <div id="products" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:25px;padding:20px 0;">
          ${productsHTML}
        </div>
      </div>
    `;
    
    if (!document.getElementById('folderStyles')) {
      const style = document.createElement('style');
      style.id = 'folderStyles';
      style.textContent = `
        @keyframes fadeIn {
          from { opacity: 0; transform: translateY(20px); }
          to { opacity: 1; transform: translateY(0); }
        }
        .card {
          animation: fadeIn 0.3s ease;
        }
        .card:nth-child(1) { animation-delay: 0.05s; }
        .card:nth-child(2) { animation-delay: 0.1s; }
        .card:nth-child(3) { animation-delay: 0.15s; }
        .card:nth-child(4) { animation-delay: 0.2s; }
        .card:nth-child(5) { animation-delay: 0.25s; }
        .card:nth-child(6) { animation-delay: 0.3s; }
        .card:nth-child(7) { animation-delay: 0.35s; }
        .card:nth-child(8) { animation-delay: 0.4s; }
        .card:nth-child(9) { animation-delay: 0.45s; }
        .card:nth-child(10) { animation-delay: 0.5s; }
      `;
      document.head.appendChild(style);
    }
  }

  // ============ Apply Theme ============
  const savedTheme = localStorage.getItem('theme');
  if(savedTheme === 'dark') {
    document.body.classList.add('dark');
  }

  // ============ Load Folder ============
  loadFolder();
</script>

</body>
</html>
