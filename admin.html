<!DOCTYPE html>
<html>
<head>
  <title>Admin Dashboard - Pro Store</title>
  <link rel="stylesheet" href="style.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>

<button class="theme-toggle" onclick="toggleTheme()">🌓 Dark/Light</button>

<div class="header">
  <h1>👑Admin Dashboard</h1>
  <p>Manage your products, track views, and grow your store</p>
</div>

<div class="admin-container">
  <h2 id="formTitle">📝 Add New Product</h2>
  
  <input id="title" class="admin-input" placeholder="Product Name *" required>
  <select id="category" class="admin-input">
    <option value="">Select Category *</option>
    <option value="men">👔 Men</option>
    <option value="women">💄 Women</option>
    <option value="kids">🧸 Kids</option>
  </select>
  
  <input type="file" id="imageFile" class="admin-input" accept="image/*">
  
  <input id="amazon" class="admin-input" placeholder="Amazon Product Link (optional)">
  <input id="flipkart" class="admin-input" placeholder="Flipkart Product Link (optional)">
  <input id="meesho" class="admin-input" placeholder="Meesho Product Link (optional)">
  
  <button class="publish-btn" id="publishBtn" onclick="addProduct()">🚀 Publish Product</button>
  
  <div id="productsList" class="products-list"></div>
</div>

<footer>
  Powered By <a href="https://t.me/+4s4mTS5NRi02M2E1" target="_blank">XBI | Join Now</a>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="admin.js"></script>

</body>
</html>
